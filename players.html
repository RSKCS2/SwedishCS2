        <svg width="22" height="22" viewBox="0 0 32 32" class="shrink-0"><rect width="32" height="32" rx="6" fill="#002244"/><rect y="12" width="32" height="8" fill="#E6C200"/><rect x="12" width="8" height="32" fill="#E6C200"/></svg>

        <a class="nav-link text-on-surface-variant font-medium hover:text-swedish-gold transition-colors duration-200 h-full flex items-center" href="teams">Teams</a>

    </div>
    <div class="flex items-center gap-2 md:hidden">
      <button type="button" onclick="sharePage('SweCS2 · Players')" aria-label="Share this page"
        class="w-9 h-9 flex items-center justify-center rounded-full bg-deep-navy border border-outline-variant/30 text-on-surface-variant hover:text-swedish-gold hover:border-swedish-gold transition-colors shrink-0">
        <span class="material-symbols-outlined text-lg">share</span>

      <button id="mobile-menu-btn" type="button" onclick="toggleMobileMenu()" aria-expanded="false" aria-controls="mobile-menu" aria-label="Toggle navigation menu"

  <a class="nav-link text-on-surface-variant font-medium py-2" href="./">Live Scores</a>
  <a class="nav-link text-on-surface-variant font-medium py-2" href="history">Results</a>
  <a class="nav-link text-on-surface-variant font-medium py-2" href="teams">Teams</a>
  <a class="nav-link text-swedish-gold font-bold py-2" href="players" aria-current="page">Players</a>
  <div class="relative mt-2">
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
    <input type="text" autocomplete="off"
      class="w-full bg-deep-navy border border-outline-variant/30 text-on-surface text-sm rounded-full pl-9 pr-4 py-2 focus:ring-swedish-gold focus:border-swedish-gold"
      placeholder="Search players…" oninput="onPlayerSearch(this.value)" />
  </div>
</div>

<main class="flex-1 w-full max-w-[1200px] mx-auto px-container-padding py-stack-md flex gap-gutter">
  <div class="flex-1 flex flex-col gap-stack-md">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-2">
      <div>
        <h1 class="font-display-lg text-display-lg text-on-surface">Swedish Players</h1>
        <p class="text-on-surface-variant font-body-md text-body-md mt-2">Every tracked SE-nationality CS2 player</p>
      </div>
    </div>

    <div class="bg-deep-navy rounded-xl p-4 border border-outline-variant/20 flex flex-wrap gap-2 items-center">
      <span class="font-label-caps text-label-caps text-on-surface-variant mr-2">PERIOD:</span>
      <div id="period-tabs" class="flex flex-wrap gap-2"></div>
    </div>

    <div id="custom-date-range" class="hidden bg-deep-navy rounded-xl p-4 border border-outline-variant/20 flex flex-wrap gap-4 items-center">
      <span class="font-label-caps text-label-caps text-on-surface-variant">CUSTOM RANGE:</span>
      <label class="flex items-center gap-2 text-sm text-on-surface-variant">
        From
        <input id="custom-date-start" type="date"
          class="bg-surface-container-high border border-outline-variant/30 text-on-surface text-sm rounded-md py-1.5 px-2 focus:outline-none focus:border-swedish-gold"
          onchange="onCustomDateChange()" />
      </label>
      <label class="flex items-center gap-2 text-sm text-on-surface-variant">
        To
        <input id="custom-date-end" type="date"
          class="bg-surface-container-high border border-outline-variant/30 text-on-surface text-sm rounded-md py-1.5 px-2 focus:outline-none focus:border-swedish-gold"
          onchange="onCustomDateChange()" />
      </label>
    </div>

    <div class="bg-deep-navy rounded-xl p-4 border border-outline-variant/20 flex flex-wrap gap-3 items-center">
      <span class="font-label-caps text-label-caps text-on-surface-variant mr-2">TEAM:</span>
      <select id="team-filter" onchange="onTeamFilter(this.value)"
        class="bg-surface-container-high border-none text-on-surface text-sm rounded-md py-1.5 pl-3 pr-8 focus:ring-1 focus:ring-swedish-gold">
        <option value="">All Teams</option>
      </select>
    </div>

    <div id="content" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="flex flex-col items-center justify-center py-24 col-span-full">
        <div class="spinner"></div>
        <p class="font-metadata text-metadata text-on-surface-variant">Loading players…</p>
      </div>
    </div>
  </div>
</main>

<footer class="bg-deep-navy full-width mt-stack-lg border-t border-outline-variant/30">
  <div class="w-full py-stack-lg px-container-padding max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
    <div class="font-headline-lg-mobile text-headline-lg-mobile text-swedish-gold opacity-80 hover:opacity-100 transition-opacity">SweCS2</div>
    <div class="flex flex-wrap justify-center gap-6">
      <a class="font-metadata text-metadata text-on-surface-variant hover:text-on-surface transition-colors" href="terms">Terms of Service</a>
      <a class="font-metadata text-metadata text-on-surface-variant hover:text-on-surface transition-colors" href="privacy">Privacy Policy</a>
      <a class="font-metadata text-metadata text-on-surface-variant hover:text-on-surface transition-colors" href="mailto:contact@rskcs2.github.io">Contact</a>
    </div>
    <div class="font-metadata text-metadata text-tertiary">© 2026 SweCS2</div>
  </div>
</footer>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<div id="turnstile-container"></div>
<script src="shared.js?v=4"></script>
<script>
const PERIODS = [
  ['month',  'This Month'],
  ['3m',     '3 Months'],
  ['week',   'This Week'],
  ['day',    'Today'],
  ['6m',     '6 Months'],
  ['9m',     '9 Months'],
  ['year',   'This Year'],
  ['all',    'All Time'],
  ['custom', 'Custom Date'],
];

let allPlayers = [];
let playerQuery = '';
let teamFilterId = '';
let periodKey = 'month';
let customStart = '';
let customEnd = '';
let teamTierMap = {};
let valveGlobalCache = [];
let valveEuropeCache = [];
let valveAmericasCache = [];
let valveAsiaCache = [];
let playerStatRows = [];
let playerStatMap = {};

window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('period-tabs').innerHTML = PERIODS.map(([key, label]) => `
    <button class="period-tab font-label-caps text-label-caps px-4 py-2 rounded border border-outline-variant/30 text-on-surface-variant hover:border-swedish-gold transition-colors"
      aria-pressed="${key === periodKey}" onclick="setPeriod('${key}')">${label}</button>`).join('');

  try {
    await ensureSwedishData();
    allPlayers = getSwedishPlayers().filter(p => (p.role || '').toLowerCase() !== 'coach');

    const teamOptions = [...new Map(allPlayers.filter(p => p.current_team).map(p => [p.current_team.id, p.current_team.name])).entries()]
      .sort((a, b) => a[1].localeCompare(b[1]));
    document.getElementById('team-filter').innerHTML =
      '<option value="">All Teams</option>' + teamOptions.map(([id, name]) => `<option value="${id}">${name}</option>`).join('');

    try {
      const teamIds = [...new Set(allPlayers.filter(p => p.current_team).map(p => p.current_team.id))];
      await ensureTeamCountries(teamIds);
    } catch(e) {
      console.warn('[SWE] Could not load team countries:', e);
    }

    try {
      [valveGlobalCache, valveEuropeCache, valveAmericasCache, valveAsiaCache] = await Promise.all([
        fetchValveStandings('global'),
        fetchValveStandings('europe'),
        fetchValveStandings('americas'),
        fetchValveStandings('asia'),
      ]);
      recomputeTierMap();
    } catch(e) {
      console.warn('[SWE] Could not load Valve standings for player ranking:', e);
    }

    try {
      playerStatRows = await ensurePlayerGameStats();
      recomputeStats();
    } catch(e) {
      console.warn('[SWE] Could not load player stats:', e);
    }

    renderPlayers();
  } catch(err) {
    console.error('[SWE CS2] Players fetch error:', err);
    document.getElementById('content').innerHTML = `
      <div class="flex flex-col items-center justify-center py-24 text-center gap-3 col-span-full">
        <span class="material-symbols-outlined text-5xl text-on-surface-variant/50">wifi_off</span>
        <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Connection Error</h3>
        <p class="font-body-md text-body-md text-on-surface-variant">Unable to load player data. Please refresh.</p>
        <button onclick="location.reload()" class="mt-2 bg-swedish-gold text-deep-navy px-4 py-2 rounded-lg font-medium">Retry</button>
      </div>`;
  }
});

function onPlayerSearch(q) {
  playerQuery = q.toLowerCase();
  renderPlayers();
}

function onTeamFilter(id) {
  teamFilterId = id;
  renderPlayers();
}

function setPeriod(key) {
  periodKey = key;
  document.querySelectorAll('#period-tabs .period-tab').forEach(btn => btn.setAttribute('aria-pressed', 'false'));
  event.target.setAttribute('aria-pressed', 'true');
  document.getElementById('custom-date-range').classList.toggle('hidden', key !== 'custom');
  recomputeTierMap();
  recomputeStats();
  renderPlayers();
}

function onCustomDateChange() {
  customStart = document.getElementById('custom-date-start').value;
  customEnd   = document.getElementById('custom-date-end').value;
  recomputeTierMap();
  recomputeStats();
  renderPlayers();
}

function recomputeStats() {
  if (!playerStatRows.length) { playerStatMap = {}; return; }
  const { start, end } = computePeriodRange(periodKey, customStart, customEnd);
  playerStatMap = buildPlayerStatProfiles(playerStatRows, start, allPlayers, end);
}

// Competition weight per team, now sourced from Valve's Regional
// Standings (see buildValveTierMap in shared.js) instead of match
// history. Valve's list is a single global snapshot, not scoped to any
// date range, so this no longer depends on the selected period — it just
// maps each team currently on the roster to its Valve-rank-derived
// weight.
function recomputeTierMap() {
  teamTierMap = buildValveTierMap(
    allPlayers.filter(p => p.current_team).map(p => p.current_team),
    valveGlobalCache
  );
}

function renderPlayers() {
  let players = allPlayers.slice();
  if (teamFilterId) players = players.filter(p => String(p.current_team?.id) === String(teamFilterId));
  if (playerQuery) players = players.filter(p => (p.name || '').toLowerCase().includes(playerQuery));

  // Rank by a combined K/D + ADR + sample-size + Valve-standings score
  // (see rankPlayersByRating in shared.js) — not just team standing or
  // name — so a player who only racks up stats against unranked teams
  // can't land at #1 over someone performing well against real
  // competition.
  players = rankPlayersByRating(players, playerStatMap, teamTierMap);

  if (!players.length) {
    document.getElementById('content').innerHTML = `
      <div class="flex flex-col items-center justify-center py-24 text-center gap-3 col-span-full">
        <span class="material-symbols-outlined text-5xl text-on-surface-variant/50">person_search</span>
        <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">No Players Found</h3>
        <p class="font-body-md text-body-md text-on-surface-variant">Try a different search or team.</p>
      </div>`;
    return;
  }

  document.getElementById('content').innerHTML = players.map((p, i) => renderPlayerCard(p, i + 1)).join('');
}

function renderPlayerCard(p, position) {
  const rank = position;
  const teamSwe = p.current_team ? sweInfo(p.current_team) : null;
  const teamFlagLine = p.current_team
    ? (teamSwe?.isMajority ? '🇸🇪' : (teamCountryInfo(p.current_team.id) ? teamCountryLine(p.current_team.id).split(' ')[0] : ''))
    : '';
  // Region-aware rank badge — a team's home region isn't always Europe
  // (see teamValveRegion), and the tooltip spells out both region and
  // world rank so nothing's lost by only showing one number.
  let rankBadgeValue = null, rankBadgeTitle = '';
  if (p.current_team) {
    const worldRank = findValveRank(valveGlobalCache, p.current_team.name)?.rank ?? null;
    const teamRegion = teamValveRegion(p.current_team.id);
    const regionCache = { europe: valveEuropeCache, americas: valveAmericasCache, asia: valveAsiaCache }[teamRegion];
    const regionRank = findValveRank(regionCache, p.current_team.name)?.rank ?? null;
    rankBadgeValue = regionRank ?? worldRank;
    rankBadgeTitle = regionRank
      ? `${p.current_team.name} — ${VALVE_REGION_LABELS[teamRegion]} #${regionRank}${worldRank ? ` · World #${worldRank}` : ''}`
      : (worldRank ? `${p.current_team.name} — World #${worldRank}` : '');
  }
  const stats = playerStatMap[p.id] || {};
  const kd   = stats.kd_ratio != null ? stats.kd_ratio : '—';
  const adr  = stats.adr != null ? stats.adr : '—';
  const maps = stats.maps_played != null ? stats.maps_played : '—';
  // hs_pct/multikills only ever populate from GRID-sourced rows (see
  // shared.js's buildPlayerStatProfiles) — added as extra columns only
  // when present, in the same stat grid as K/D, ADR and Maps, instead of
  // a separate row underneath.
  const statCols = [
    { label: 'K/D', value: kd },
    { label: 'ADR', value: adr },
    { label: 'Maps', value: maps },
  ];
  if (stats.hs_pct != null) statCols.push({ label: 'HS%', value: stats.hs_pct + '%' });
  if (stats.multikills) statCols.push({ label: 'Multi-K', value: stats.multikills });

  const medal = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : null;
  const cardMedalCls  = medal ? `rank-${medal} rank-shine` : '';
  const badgeMedalCls = medal ? `rank-badge-${medal}` : 'bg-swedish-gold text-deep-navy';

  return `
  <div class="bg-deep-navy rounded-xl border border-outline-variant/30 hover:border-outline-variant/60 transition-colors overflow-hidden flex flex-col relative ${cardMedalCls}">
    ${rank ? `<div class="absolute top-2 left-2 z-10 w-8 h-8 rounded-lg ${badgeMedalCls} font-black flex items-center justify-center text-xs">#${rank}</div>` : ''}
    <div class="h-48 ${medal ? '' : 'bg-surface-container-high'} relative overflow-hidden">
      ${teamLogo({ image_url: p.image_url, name: p.name }, 'w-full h-full object-contain')}
      <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-deep-navy/90 to-transparent px-4 pt-8 pb-2">
        <h3 class="player-meta-badge font-body-md text-body-md text-on-surface font-bold m-0 truncate">${p.name || '?'}</h3>
        <p class="player-meta-badge font-metadata text-metadata text-on-surface-variant truncate${rankBadgeTitle ? ' cursor-help' : ''}"${rankBadgeTitle ? ` title="${rankBadgeTitle}"` : ''}>${teamFlagLine ? teamFlagLine + ' ' : ''}${p.current_team?.name || 'Free agent'}${rankBadgeValue ? ` #${rankBadgeValue}` : ''}</p>
      </div>
    </div>
    <div class="p-4 flex flex-col gap-3 flex-1">
      ${p.role ? `<span class="font-label-caps text-label-caps bg-surface-container-highest text-on-surface-variant px-2 py-1 rounded self-start">${p.role}</span>` : ''}
      <div class="grid gap-2 text-center border-t border-outline-variant/10 pt-3" style="grid-template-columns: repeat(${statCols.length}, minmax(0, 1fr));">
        ${statCols.map(s => `
        <div>
          <div class="font-bold text-sm text-on-surface">${s.value}</div>
          <div class="font-label-caps text-label-caps text-on-surface-variant">${s.label}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}
</script>
</body>
</html>
