        class="w-9 h-9 flex items-center justify-center rounded-full bg-deep-navy border border-outline-variant/30 text-on-surface-variant hover:text-swedish-gold hover:border-swedish-gold transition-colors shrink-0">
        <span class="material-symbols-outlined text-lg">share</span>
      </button>
    </div>
    <div class="flex items-center gap-2 md:hidden">
      <button type="button" onclick="sharePage('SweCS2 · Live Scores')" aria-label="Share this page"
        class="w-9 h-9 flex items-center justify-center rounded-full bg-deep-navy border border-outline-variant/30 text-on-surface-variant hover:text-swedish-gold hover:border-swedish-gold transition-colors shrink-0">
        <span class="material-symbols-outlined text-lg">share</span>
      </button>
      <button id="mobile-menu-btn" type="button" onclick="toggleMobileMenu()" aria-expanded="false" aria-controls="mobile-menu" aria-label="Toggle navigation menu"
        class="w-9 h-9 flex items-center justify-center rounded-full bg-deep-navy border border-outline-variant/30 text-on-surface-variant">

      </button>

  <div id="mobile-menu" class="hidden md:hidden border-t border-outline-variant/20 px-container-padding py-3 flex flex-col gap-1">
    <a class="nav-link text-swedish-gold font-bold py-2" href="./" aria-current="page">Live Scores</a>
    <a class="nav-link text-on-surface-variant font-medium py-2" href="history">Results</a>
    <a class="nav-link text-on-surface-variant font-medium py-2" href="teams">Teams</a>
    <a class="nav-link text-on-surface-variant font-medium py-2" href="players">Players</a>

</header>

<div class="flex-1 w-full max-w-[1200px] mx-auto px-container-padding py-stack-md flex gap-gutter">
  <main class="flex-1 min-w-0 flex flex-col gap-stack-lg">
    <div id="content">
      <div class="flex flex-col items-center justify-center py-24">
        <div class="spinner"></div>
        <p class="font-metadata text-metadata text-on-surface-variant">Loading matches…</p>
      </div>
    </div>
  </main>

  <aside class="hidden lg:flex flex-col w-80 gap-stack-md shrink-0">
    <div class="bg-deep-navy rounded-xl p-4 border border-outline-variant/10">
      <h3 class="font-label-caps text-label-caps text-on-surface-variant mb-4 uppercase">Trending</h3>
      <div>
        <h4 class="font-bold text-lg mb-3">Top Players This Month</h4>
        <ul id="sidebar-players" class="flex flex-col gap-3">
          <li class="font-metadata text-metadata text-on-surface-variant">Loading…</li>
        </ul>
      </div>
    </div>
    <div class="bg-deep-navy rounded-xl p-4 border border-outline-variant/10">
      <h4 class="font-bold text-lg mb-3">Upcoming Tournaments</h4>
      <ul id="sidebar-tournaments" class="flex flex-col gap-3">
        <li class="font-metadata text-metadata text-on-surface-variant">Loading…</li>
      </ul>
    </div>
    <div class="bg-deep-navy rounded-xl p-4 border border-outline-variant/10">
      <h4 class="font-bold text-lg mb-3">News Feed</h4>
      <div id="sidebar-news" class="flex flex-col gap-3 font-metadata text-metadata text-on-surface-variant">Loading…</div>
    </div>
  </aside>
</div>

<footer class="bg-deep-navy full-width mt-stack-lg border-t border-outline-variant/30">
  <div class="w-full py-stack-lg px-container-padding max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="font-headline-lg-mobile text-headline-lg-mobile text-swedish-gold font-bold">SweCS2</div>
    <div class="flex flex-wrap justify-center gap-6 font-metadata text-metadata text-on-surface-variant">
      <a class="hover:text-on-surface transition-colors opacity-80 hover:opacity-100" href="terms">Terms of Service</a>
      <a class="hover:text-on-surface transition-colors opacity-80 hover:opacity-100" href="privacy">Privacy Policy</a>
      <a class="hover:text-on-surface transition-colors opacity-80 hover:opacity-100" href="mailto:contact@rskcs2.github.io">Contact</a>
    </div>
    <div class="font-metadata text-metadata text-tertiary text-center md:text-right">© 2026 SweCS2</div>
  </div>
</footer>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<div id="turnstile-container"></div>
<script src="shared.js?v=4"></script>
<script>
const LIVE_TTL     = 30  * 1000;
const UPCOMING_TTL = 5   * 60 * 1000;

let pollTimer = null;
let lastScoreKey = '';

window.addEventListener('DOMContentLoaded', () => {
  const cached = cacheGet('swe_live');
  if (cached) renderMatches(cached.live, cached.upcoming);
  fetchMatches();
  loadNews();
});

const NEWS_POLL_MS = 15 * 60 * 1000;

async function loadNews() {
  try {
    const items = await ensureFragbiteNews();
    document.getElementById('sidebar-news').innerHTML = renderNewsFeed(items);
  } catch(e) {
    console.warn('[SWE] News render failed:', e);
  } finally {
    setTimeout(loadNews, NEWS_POLL_MS);
  }
}

let historyMatches = [];
let playerStatRows = [];

async function fetchMatches() {
  try {
    await ensureSwedishData();

    const [runningList, upcomingList, history, statRows] = await Promise.all([
      pandaFetch('/csgo/matches/running?per_page=50&include=opponents,results,games,pick_bans'),
      pandaFetch('/csgo/matches/upcoming?per_page=30&sort=begin_at&include=opponents'),
      // Client-side only, served straight from the Worker's KV cache (no
      // PandaScore hit) — used purely for the head-to-head line on upcoming
      // cards and for the "Top Players" sidebar's competition-tier
      // weighting. A failure here shouldn't break the live scoreboard.
      ensureMatchHistory().catch(e => { console.warn('[SWE] History unavailable for H2H:', e); return []; }),
      // Also KV-backed, no live PandaScore hit — feeds real K/D/ADR into
      // the "Top Players" sidebar instead of the old placeholder numbers.
      ensurePlayerGameStats().catch(e => { console.warn('[SWE] Player stats unavailable for sidebar:', e); return []; }),
    ]);
    historyMatches = history || [];
    playerStatRows = statRows || [];

    const sweRunning  = runningList.filter(hasSweTeam);
    const sweUpcoming = upcomingList.filter(hasSweTeam);

    let gridSeries = [];
    try {
      const now = new Date();
      const gte = new Date(now - 3 * 60 * 60 * 1000).toISOString();
      const lte = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000).toISOString();
      const gd  = await gridFetch('/central', QUERY_CS2_SERIES, { gte, lte });
      gridSeries = (gd?.allSeries?.edges || []).map(e => e.node).filter(s => s.title?.nameShortened === 'cs2');
    } catch(e) { console.warn('[GRID] Central failed:', e); }

    const enriched = await Promise.all(sweRunning.map(async match => {
      const t1 = match.opponents?.[0]?.opponent;
      const t2 = match.opponents?.[1]?.opponent;
      const gridMatch = findGridSeries(t1?.name, t2?.name, gridSeries);
      let state = null;
      if (gridMatch) {
        try {
          const sd = await gridFetch('/live', QUERY_SERIES_STATE, { id: gridMatch.id });
          state = sd?.seriesState || null;
        } catch(e) { console.warn('[GRID] State failed:', e); }
      }
      return { ...match, gridMatch, state };
    }));

    cacheSet('swe_live', { live: enriched, upcoming: sweUpcoming });

    const scoreKey = JSON.stringify(enriched.map(m => ({
      id: m.id,
      games: m.state?.games?.map(g => g.teams?.map(t => t.score)),
    })));

    if (scoreKey !== lastScoreKey) {
      lastScoreKey = scoreKey;
      renderMatches(enriched, sweUpcoming);
    }

    renderSidebar(sweUpcoming);

    const interval = enriched.length > 0 ? LIVE_TTL : sweUpcoming.length > 0 ? UPCOMING_TTL : 15 * 60 * 1000;
    clearTimeout(pollTimer);
    pollTimer = setTimeout(fetchMatches, interval);

  } catch(err) {
    console.error('[SWE CS2] Fetch error:', err);
    if (!cacheGet('swe_live')) {
      document.getElementById('content').innerHTML = `
        <div class="flex flex-col items-center justify-center py-24 text-center gap-3">
          <span class="material-symbols-outlined text-5xl text-on-surface-variant/50">wifi_off</span>
          <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Connection Error</h3>
          <p class="font-body-md text-body-md text-on-surface-variant max-w-md">${err.status ? 'API error ' + err.status + '.' : 'Unable to reach server.'}</p>
        </div>`;
    }
    clearTimeout(pollTimer);
    pollTimer = setTimeout(fetchMatches, 60 * 1000);
  }
}

function renderMatches(live, upcoming) {
  let html = '';
  if (!live.length && !upcoming.length) {
    html = `
      <div class="flex flex-col items-center justify-center py-24 text-center gap-3">
        <span class="material-symbols-outlined text-5xl text-on-surface-variant/50">satellite_alt</span>
        <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">No Swedish Matches</h3>
        <p class="font-body-md text-body-md text-on-surface-variant max-w-md">No live or upcoming CS2 matches with Swedish players right now.</p>
      </div>`;
  } else {
    if (live.length) {
      html += `<section class="flex flex-col gap-stack-sm gap-4">
        <div class="flex items-center gap-3 mb-2">
          <h1 class="font-headline-lg text-headline-lg text-swedish-gold font-extrabold">Live Matches</h1>
        </div>
        <div class="flex items-center gap-2 mb-2">
          <div class="w-1 h-4 bg-primary-container"></div>
          <span class="font-label-caps text-label-caps text-on-surface-variant">${live.length} LIVE</span>
        </div>
        ${live.map(renderLiveCard).join('')}
      </section>`;
    }
    if (upcoming.length) {
      html += `<section class="flex flex-col gap-stack-sm gap-4">
        <div class="flex items-center gap-3 mb-2">
          <h2 class="font-headline-lg text-headline-lg text-on-surface font-extrabold">Upcoming Matches</h2>
        </div>
        ${upcoming.map(renderUpcomingCard).join('')}
      </section>`;
    }
  }
  document.getElementById('content').innerHTML = html;
}

function mapDots(match, t1Maps, t2Maps) {
  const total = match.number_of_games || 1;
  const dots = Array.from({ length: total }, (_, i) => {
    const done = i < t1Maps + t2Maps, cur = i === t1Maps + t2Maps;
    const cls = done ? 'bg-on-surface-variant' : cur ? 'bg-swedish-gold glow-active' : 'bg-outline-variant/40';
    return `<span class="w-2 h-2 rounded-full ${cls}"></span>`;
  }).join('');
  return `<div class="flex items-center gap-1.5">${dots}</div>`;
}

function renderLiveCard(match) {
  const o1 = match.opponents?.[0]?.opponent;
  const o2 = match.opponents?.[1]?.opponent;
  const { t1Maps: m1, t2Maps: m2 } = extractMapScore(match);
  const [t1, t2] = orderBySwedish(o1, o2);
  const swapped = t1 !== o1;
  const t1Maps = swapped ? m2 : m1;
  const t2Maps = swapped ? m1 : m2;
  const t1swe = sweInfo(t1);
  const t2swe = sweInfo(t2);
  const context = matchContext(match);
  const bo = match.number_of_games ? 'BO' + match.number_of_games : '';

  return `
  <article class="bg-gradient-to-r from-deep-navy to-surface-container rounded-xl overflow-hidden border border-swedish-gold glow-active relative">
    <div class="p-3 sm:p-4 flex items-center justify-between gap-2 relative">
      <div class="flex-1 flex flex-col sm:flex-row justify-center sm:justify-end items-center gap-1 sm:gap-3 min-w-0">
        ${sweCountBadge(t1, 'hidden sm:inline-flex sm:order-1')}
        ${teamLogo(t1, 'order-1 sm:order-3 w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-contain bg-surface-container p-1 shrink-0')}
        <span class="order-2 font-bold text-xs sm:text-lg text-center sm:text-right break-words leading-tight${t1swe ? ' text-swedish-gold' : ''}">${t1?.name || 'TBD'}</span>
      </div>
      <div class="flex flex-col items-center justify-center shrink-0 min-w-[76px] sm:min-w-[120px]">
        <span class="font-label-caps text-label-caps text-swedish-gold mb-1 hidden sm:block">LIVE</span>
        <div class="font-match-score text-match-score tracking-wider text-white">${t1Maps} : ${t2Maps}</div>
        <div class="mt-1">${mapDots(match, t1Maps, t2Maps)}</div>
      </div>
      <div class="flex-1 flex flex-col sm:flex-row justify-center sm:justify-start items-center gap-1 sm:gap-3 min-w-0">
        ${teamLogo(t2, 'order-1 w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-contain bg-surface-container p-1 shrink-0')}
        <span class="order-2 font-bold text-xs sm:text-lg text-center sm:text-left break-words leading-tight${t2swe ? ' text-swedish-gold' : ''}">${t2?.name || 'TBD'}</span>
        ${sweCountBadge(t2, 'hidden sm:inline-flex')}
      </div>
      <div class="absolute top-2 right-2 sm:top-4 sm:right-4 flex items-center gap-1.5">
        <div class="w-2 h-2 rounded-full bg-swedish-gold live-pulse"></div>
        <span class="font-label-caps text-label-caps text-swedish-gold hidden sm:inline">LIVE</span>
      </div>
    </div>
    <div class="bg-deep-navy/50 py-2 px-4 text-center border-t border-outline-variant/10">
      <span class="font-metadata text-metadata text-on-surface-variant">${noOrphan(context + (bo ? ' · ' + bo : ''))}</span>
    </div>
  </article>`;
}

function renderUpcomingCard(match) {
  const o1 = match.opponents?.[0]?.opponent;
  const o2 = match.opponents?.[1]?.opponent;
  const [t1, t2] = orderBySwedish(o1, o2);
  const t1swe = sweInfo(t1);
  const t2swe = sweInfo(t2);
  const context = matchContext(match);
  const timeStr = new Date(match.begin_at).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' }).toUpperCase();
  const h2h = headToHeadLine(historyMatches, t1, t2);
  const tBadge = tournamentBadge(match);

  return `
  <article class="bg-deep-navy rounded-xl overflow-hidden border border-outline-variant/30 hover:bg-primary-container transition-colors">
    <div class="p-3 sm:p-4 flex items-center justify-between gap-2">
      <div class="flex-1 flex flex-col sm:flex-row justify-center sm:justify-end items-center gap-1 sm:gap-3 min-w-0">
        ${sweCountBadge(t1, 'hidden sm:inline-flex sm:order-1')}
        ${teamLogo(t1, 'order-1 sm:order-3 w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-contain bg-surface-container-highest p-1 opacity-70 shrink-0')}
        <span class="order-2 font-bold text-xs sm:text-lg text-center sm:text-right text-on-surface-variant break-words leading-tight${t1swe ? ' text-swedish-gold/90' : ''}">${t1?.name || 'TBD'}</span>
      </div>
      <div class="flex flex-col items-center justify-center shrink-0 min-w-[64px] sm:min-w-[120px]">
        <span class="font-label-caps text-label-caps text-tertiary mb-1">${timeStr}</span>
        <div class="font-match-score text-match-score tracking-wider text-on-surface-variant">0 : 0</div>
      </div>
      <div class="flex-1 flex flex-col sm:flex-row justify-center sm:justify-start items-center gap-1 sm:gap-3 min-w-0">
        ${teamLogo(t2, 'order-1 w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-contain bg-surface-container-highest p-1 opacity-70 shrink-0')}
        <span class="order-2 font-bold text-xs sm:text-lg text-center sm:text-left text-on-surface-variant break-words leading-tight${t2swe ? ' text-swedish-gold/90' : ''}">${t2?.name || 'TBD'}</span>
        ${sweCountBadge(t2, 'hidden sm:inline-flex')}
      </div>
    </div>
    <div class="bg-surface-container-low/50 py-2 px-4 flex flex-col items-center gap-1 text-center border-t border-outline-variant/10">
      <span class="font-metadata text-metadata text-on-surface-variant/70">${noOrphan(context)}</span>
      ${tBadge}
      ${h2h}
    </div>
  </article>`;
}

// "Top Players This Month" — ranked by real K/D + ADR + sample size +
// competition-tier score (rankPlayersByRating, see shared.js), not just
// raw stats, so a player who only plays D-tier matches can't land at #1
// over someone performing well against real competition.
function renderSidebar(sweUpcoming) {
  const { start, end } = computePeriodRange('month');
  const periodMatches = historyMatches.filter(m => {
    const d = new Date(m.begin_at);
    return d >= start && (!end || d <= end);
  });
  const tierMap = buildTeamTierMap(periodMatches.length ? periodMatches : historyMatches);
  const statMap = playerStatRows.length ? buildPlayerStatProfiles(playerStatRows, start, getSwedishPlayers(), end) : {};

  const players = rankPlayersByRating(getSwedishPlayers(), statMap, tierMap)
    .filter(p => statMap[p.id]?.maps_played)
    .slice(0, 5);

  const playersHtml = players.length
    ? players.map(p => {
        const s = statMap[p.id] || {};
        return `
      <li class="flex items-center gap-3">
        ${teamLogo({ image_url: p.image_url, name: p.name }, 'w-8 h-8 rounded-full object-cover bg-surface-container-highest')}
        <div class="flex-1 min-w-0">
          <div class="font-bold text-sm truncate">${p.name || '?'}</div>
          <div class="font-metadata text-metadata text-on-surface-variant/70 truncate">${p.current_team?.name || 'Free agent'}</div>
          <div class="font-label-caps text-label-caps text-swedish-gold/90 mt-0.5">${s.kd_ratio ?? '—'} K/D · ${s.adr ?? '—'} ADR · ${s.maps_played ?? 0} maps</div>
        </div>
      </li>`;
      }).join('')
    : `<li class="font-metadata text-metadata text-on-surface-variant">No player data yet.</li>`;
  document.getElementById('sidebar-players').innerHTML = playersHtml;

  const seenTournaments = new Map();
  sweUpcoming.forEach(m => {
    const name = m.tournament?.name || m.league?.name;
    if (!name) return;
    const existing = seenTournaments.get(name);
    if (!existing || new Date(m.begin_at) < new Date(existing)) seenTournaments.set(name, m.begin_at);
  });
  const tournaments = [...seenTournaments.entries()].sort((a, b) => new Date(a[1]) - new Date(b[1])).slice(0, 5);
  document.getElementById('sidebar-tournaments').innerHTML = tournaments.length
    ? tournaments.map(([name, date]) => `
      <li class="flex items-center gap-3">
        <div class="w-8 h-8 bg-surface-container-highest rounded flex items-center justify-center text-swedish-gold text-xs font-bold shrink-0">${name.slice(0, 2).toUpperCase()}</div>
        <div class="min-w-0">
          <div class="font-bold text-sm truncate">${name}</div>
          <div class="font-metadata text-metadata text-on-surface-variant/70">${new Date(date).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' })}</div>
        </div>
      </li>`).join('')
    : `<li class="font-metadata text-metadata text-on-surface-variant">Nothing scheduled.</li>`;
}

// Fragbite CS2 news — fetched via ensureFragbiteNews() (see shared.js),
// which pulls from the Worker's /news route. Each card links straight out
// to the article on fragbite.se, this site doesn't host the article text.
function renderNewsFeed(items) {
  if (!items || !items.length) {
    return `<span class="text-on-surface-variant">No news right now.</span>`;
  }
  return items.map(n => `
    <a href="${n.link}" target="_blank" rel="noopener noreferrer"
       class="flex gap-3 pb-3 border-b border-outline-variant/10 last:border-0 last:pb-0 group">
      ${n.image
        ? `<img src="${n.image}" alt="" loading="lazy" class="w-14 h-14 rounded-lg object-cover shrink-0 bg-surface-container-highest" onerror="this.style.display='none'" />`
        : `<div class="w-14 h-14 rounded-lg bg-surface-container-highest shrink-0"></div>`}
      <div class="flex-1 min-w-0">
        <span class="text-on-surface text-sm font-medium leading-snug group-hover:text-swedish-gold transition-colors line-clamp-2">${n.title}</span>
        <div class="font-label-caps text-label-caps text-on-surface-variant/60 mt-1">${timeAgo(n.pubDate)} · Fragbite</div>
      </div>
    </a>`).join('');
}
</script>
</body>
</html>
