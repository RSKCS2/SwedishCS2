<div id="turnstile-container"></div>
<script src="shared.js?v=4"></script>
<script>
const PERIODS = [
  ['month',  'This Month'],
  ['3m',     '3 Months'],
  ['week',   'This Week'],
  ['day',    'Today'],
  ['6m',     '6 Months'],
  ['9m',     '9 Months'],
  ['year',   'This Year'],
  ['custom', 'Custom Date'],
];
const PAGE_SIZE = 25;

let allMatches  = [];
let searchQuery = '';
let activePeriod = 'month';
let customStart  = '';
let customEnd    = '';
let currentPage  = 1;
let teamFilterId = '';

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('period-tabs').innerHTML = PERIODS.map(([key, label], i) => `
    <button class="period-tab font-label-caps text-label-caps px-4 py-2 rounded border border-outline-variant/30 text-on-surface-variant hover:border-swedish-gold transition-colors"
      aria-pressed="${key === activePeriod}" onclick="setPeriod('${key}')">${label}</button>`).join('');

  ensureMatchHistory().then(matches => {
    allMatches = matches;
    if (allMatches.length) {
      document.getElementById('stats-section').classList.remove('hidden');

      const teamOptions = [...new Map(
        allMatches.flatMap(m => [m.opponents?.[0]?.opponent, m.opponents?.[1]?.opponent])
          .filter(Boolean).map(t => [t.id, t.name])
      ).entries()].sort((a, b) => a[1].localeCompare(b[1]));
      document.getElementById('team-filter').innerHTML =
        '<option value="">All Teams</option>' + teamOptions.map(([id, name]) => `<option value="${id}">${name}</option>`).join('');

      renderResults();
    } else {
      document.getElementById('content').innerHTML = `
        <div class="flex flex-col items-center justify-center py-24 text-center gap-3">
          <span class="material-symbols-outlined text-5xl text-on-surface-variant/50">bar_chart</span>
          <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">No Matches Found</h3>
          <p class="font-body-md text-body-md text-on-surface-variant">No match history is cached yet.</p>
        </div>`;
    }
  }).catch(err => console.error('[SWE CS2] History fetch error:', err));
});

function filterByPeriod(matches, period) {
  const now = new Date();
  let start;
  switch(period) {
    case 'year':    start = new Date(now.getFullYear(), 0, 1); break;
    case '9m':      start = new Date(now); start.setMonth(now.getMonth() - 9); break;
    case '6m':      start = new Date(now); start.setMonth(now.getMonth() - 6); break;
    case '3m':      start = new Date(now); start.setMonth(now.getMonth() - 3); break;
    case 'month':   start = new Date(now.getFullYear(), now.getMonth(), 1); break;
    case 'week':    start = new Date(now); start.setDate(now.getDate() - now.getDay()); break;
    case 'day':     start = new Date(now); start.setHours(0,0,0,0); break;
    case 'custom': {
      const startD = customStart ? new Date(customStart) : null;
      const endD   = customEnd ? new Date(customEnd) : null;
      if (endD) endD.setHours(23, 59, 59, 999);
      return matches.filter(m => {
        const d = new Date(m.begin_at);
        if (startD && d < startD) return false;
        if (endD && d > endD) return false;
        return true;
      });
    }
    default:        start = new Date(0);
  }
  return matches.filter(m => new Date(m.begin_at) >= start);
}

function filterBySearch(matches, query) {
  if (!query) return matches;
  const q = query.toLowerCase();
  return matches.filter(m => {
    const t1 = m.opponents?.[0]?.opponent?.name?.toLowerCase() || '';
    const t2 = m.opponents?.[1]?.opponent?.name?.toLowerCase() || '';
    const tourney = (m.tournament?.name || m.league?.name || '').toLowerCase();
    return t1.includes(q) || t2.includes(q) || tourney.includes(q);
  });
}

function computeStats(matches) {
  let total = 0, sweWins = 0, sweLosses = 0;
  matches.forEach(m => {
    const t1 = m.opponents?.[0]?.opponent;
    const t2 = m.opponents?.[1]?.opponent;
    const t1swe = sweInfo(t1);
    const t2swe = sweInfo(t2);
    if (t1swe || t2swe) {
      total++;
      if (m.winner) {
        if ((t1swe && m.winner.id === t1?.id) || (t2swe && m.winner.id === t2?.id)) sweWins++;
        else sweLosses++;
      }
    }
  });
  const wr = total > 0 ? Math.round(sweWins / total * 100) : 0;
  return { total, sweWins, sweLosses, wr: wr + '%' };
}

function onSearch(q) {
  searchQuery = q;
  currentPage = 1;
  renderResults();
}

function onTeamFilter(id) {
  teamFilterId = id;
  currentPage = 1;
  renderResults();
}

function filterByTeam(matches, id) {
  if (!id) return matches;
  return matches.filter(m => String(m.opponents?.[0]?.opponent?.id) === String(id) || String(m.opponents?.[1]?.opponent?.id) === String(id));
}

function setPeriod(p) {
  activePeriod = p;
  currentPage = 1;
  document.querySelectorAll('.period-tab').forEach(btn => btn.setAttribute('aria-pressed', 'false'));
  event.target.setAttribute('aria-pressed', 'true');
  document.getElementById('custom-date-range').classList.toggle('hidden', p !== 'custom');
  renderResults();
}

function onCustomDateChange() {
  customStart = document.getElementById('custom-date-start').value;
  customEnd   = document.getElementById('custom-date-end').value;
  currentPage = 1;
  renderResults();
}

function renderResults() {
  let matches = filterByPeriod(allMatches, activePeriod);
  matches = filterBySearch(matches, searchQuery);
  matches = filterByTeam(matches, teamFilterId);
  matches = matches.sort((a, b) => new Date(b.begin_at) - new Date(a.begin_at));

  const stats = computeStats(matches);
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-wins').textContent = stats.sweWins;
  document.getElementById('stat-losses').textContent = stats.sweLosses;
  document.getElementById('stat-winrate').textContent = stats.wr;

  if (!matches.length) {
    document.getElementById('content').innerHTML = `
      <div class="flex flex-col items-center justify-center py-24 text-center gap-3">
        <span class="material-symbols-outlined text-5xl text-on-surface-variant/50">bar_chart</span>
        <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">No Matches Found</h3>
        <p class="font-body-md text-body-md text-on-surface-variant">No matches match your search or time period.</p>
      </div>`;
    return;
  }

  const totalPages = Math.ceil(matches.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = totalPages;
  currentPage = Math.max(1, currentPage);

  const start = (currentPage - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const paginated = matches.slice(start, end);

  let html = '';
  let lastDate = '';

  paginated.forEach(m => {
    const dateKey = new Date(m.begin_at).toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    if (dateKey !== lastDate) {
      html += `<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface uppercase tracking-wide mt-stack-md first:mt-0">${dateKey}</h3>`;
      lastDate = dateKey;
    }
    html += renderCard(m);
  });

  html += `
    <div class="flex flex-col items-center justify-center mt-stack-md gap-4">
      <span class="font-metadata text-metadata text-on-surface-variant">Showing <strong class="text-on-surface">${start + 1}–${Math.min(end, matches.length)}</strong> of <strong class="text-on-surface">${matches.length}</strong> matches</span>
      <div class="flex items-center gap-2">
        <button class="bg-primary-container text-on-primary-container px-4 py-2 rounded font-bold hover:opacity-90 transition-opacity text-sm uppercase disabled:opacity-40 disabled:cursor-not-allowed" onclick="goPrevPage()" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
        <span class="font-metadata text-metadata text-on-surface-variant px-2">Page ${currentPage} / ${totalPages}</span>
        <button class="bg-primary-container text-on-primary-container px-4 py-2 rounded font-bold hover:opacity-90 transition-opacity text-sm uppercase disabled:opacity-40 disabled:cursor-not-allowed" onclick="goNextPage(${totalPages})" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>
      </div>
    </div>`;

  document.getElementById('content').innerHTML = html;
}

function goPrevPage() {
  if (currentPage > 1) { currentPage--; renderResults(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}
function goNextPage(totalPages) {
  if (currentPage < totalPages) { currentPage++; renderResults(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

function renderCard(match) {
  const o1 = match.opponents?.[0]?.opponent;
  const o2 = match.opponents?.[1]?.opponent;
  const { t1Maps: m1, t2Maps: m2 } = extractMapScore(match);
  const [t1, t2] = orderBySwedish(o1, o2);
  const swapped = t1 !== o1;
  const t1Maps = swapped ? m2 : m1;
  const t2Maps = swapped ? m1 : m2;
  const t1swe = sweInfo(t1);
  const t2swe = sweInfo(t2);
  const t1Win = match.winner?.id === t1?.id;
  const t2Win = match.winner?.id === t2?.id;
  const t1ScoreCls = t1swe ? (t1Win ? 'text-green-400' : 'text-red-400') : (t1Win ? 'text-swedish-gold' : 'text-on-surface-variant');
  const t2ScoreCls = t2swe ? (t2Win ? 'text-green-400' : 'text-red-400') : (t2Win ? 'text-swedish-gold' : 'text-on-surface-variant');

  // Only one side is Swedish in the common case — that side's result drives
  // the win/loss accent on the whole card. If both or neither are Swedish
  // this stays neutral, per how the left/right ordering rule treats ties.
  const sweWin  = (t1swe && t1Win) || (t2swe && t2Win);
  const sweLoss = (t1swe && t2Win) || (t2swe && t1Win);
  const oneSwe  = (!!t1swe) !== (!!t2swe);
  const accentBorder = oneSwe ? (sweWin ? 'border-green-500' : 'border-red-500') : 'border-outline-variant/20';
  const resultBadge  = oneSwe
    ? (sweWin
        ? '<span class="font-label-caps text-label-caps bg-green-500/15 text-green-400 border border-green-500/40 px-2 py-1 rounded flex items-center gap-1 shrink-0"><span class="material-symbols-outlined text-sm">arrow_upward</span>SWE WIN</span>'
        : '<span class="font-label-caps text-label-caps bg-red-500/15 text-red-400 border border-red-500/40 px-2 py-1 rounded flex items-center gap-1 shrink-0"><span class="material-symbols-outlined text-sm">arrow_downward</span>SWE LOSS</span>')
    : '<span class="font-label-caps text-label-caps text-on-surface-variant bg-surface px-2 py-1 rounded shrink-0">FINISHED</span>';

  const context = matchContext(match);
  const timeStr = new Date(match.begin_at).toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit' });

  return `
  <div class="match-card ${accentBorder} bg-deep-navy rounded-xl border-2 overflow-hidden flex flex-col relative transition-colors">
    <div class="flex items-center justify-between px-4 pt-3 md:hidden">
      <span class="font-label-caps text-label-caps text-on-surface-variant">${timeStr}</span>
      ${resultBadge}
    </div>
    <div class="flex items-center justify-between gap-2 p-4 md:px-6">
      <div class="hidden md:flex items-center gap-4 w-1/4">
        <span class="font-label-caps text-label-caps text-on-surface-variant border-r border-outline-variant/30 pr-4">${timeStr}</span>
      </div>
      <div class="flex items-center justify-center gap-2 sm:gap-4 md:gap-8 flex-1 md:w-2/4 min-w-0">
        <div class="flex flex-col sm:flex-row items-center gap-1 sm:gap-2 justify-center sm:justify-end flex-1 min-w-0">
          ${sweCountBadge(t1, 'hidden sm:inline-flex sm:order-1')}
          ${teamLogo(t1, 'order-1 sm:order-3 w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-contain bg-surface-variant p-1 shrink-0')}
          <span class="order-2 font-bold text-xs sm:text-lg text-on-surface text-center sm:text-right break-words leading-tight${t1swe ? ' text-swedish-gold' : ''}">${t1?.name || 'TBD'}</span>
        </div>
        <div class="font-match-score text-match-score flex items-center gap-2 shrink-0">
          <span class="${t1ScoreCls}">${t1Maps}</span>
          <span class="text-on-surface-variant">-</span>
          <span class="${t2ScoreCls}">${t2Maps}</span>
        </div>
        <div class="flex flex-col sm:flex-row items-center gap-1 sm:gap-2 justify-center sm:justify-start flex-1 min-w-0">
          ${teamLogo(t2, 'order-1 w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-contain bg-surface-variant p-1 shrink-0')}
          <span class="order-2 font-bold text-xs sm:text-lg text-on-surface text-center sm:text-left break-words leading-tight${t2swe ? ' text-swedish-gold' : ''}">${t2?.name || 'TBD'}</span>
          ${sweCountBadge(t2, 'hidden sm:inline-flex')}
        </div>
      </div>
      <div class="hidden md:flex w-1/4 justify-end">
        ${resultBadge}
      </div>
    </div>
    <div class="bg-surface-container-high py-2 text-center border-t border-outline-variant/10">
      <span class="font-metadata text-metadata text-on-surface-variant">${noOrphan(context)}</span>
    </div>
  </div>`;
}
</script>
