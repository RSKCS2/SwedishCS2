<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<div id="turnstile-container"></div>
<script src="shared.js?v=4"></script>
<script>
let allTeams = [];
let teamQuery = '';
let valveGlobalCache = [];
let valveEuropeCache = [];
let valveAmericasCache = [];
let valveAsiaCache = [];
let sweValveRankMap  = {};

window.addEventListener('DOMContentLoaded', async () => {
  try {
    const matches = await ensureMatchHistory();
    const profiles = buildTeamProfiles(matches);

    // Include Swedish teams from the roster feed even if they have no
    // cached match history yet, so a new/quiet squad still shows up.
    getSwedishTeamIds().forEach(id => {
      if (!profiles[id]) {
        const info = sweInfo({ id });
        profiles[id] = { id, name: info?.name || 'Unknown Team', logo: null, matches: [], wins3m: 0, losses3m: 0 };
      }
    });

    allTeams = Object.values(profiles);

    // Roster-based country for the non-majority-Swedish teams (e.g. MIBR,
    // GamerLegion) so the flag reflects who's actually on the team instead
    // of PandaScore's often-stale `location` field. Resolved before the
    // standings fetch below since the region-aware rank lookup needs to
    // know each team's home region first.
    try {
      const nonSweIds = allTeams.filter(t => !(sweInfo({ id: t.id })?.isMajority)).map(t => t.id);
      await ensureTeamCountries(nonSweIds);
    } catch(e) { console.warn('[SWE] Could not load team countries:', e); }

    // Pull Valve's own published world/regional standings so the rank
    // badges reflect Valve's numbers, not our derived win/loss form. The
    // Swedish rank (#1, #2, #3, …) is just those world ranks reordered
    // among the Swedish teams — best world rank wins. Each team's regional
    // badge is looked up against its own home region (see teamValveRegion)
    // rather than always assuming Europe, so e.g. a Brazilian-majority
    // roster gets checked against Americas standings.
    try {
      [valveGlobalCache, valveEuropeCache, valveAmericasCache, valveAsiaCache] = await Promise.all([
        fetchValveStandings('global'),
        fetchValveStandings('europe'),
        fetchValveStandings('americas'),
        fetchValveStandings('asia'),
      ]);
    } catch(e) { console.warn('[SWE] Valve standings unavailable:', e); }
    sweValveRankMap = computeSwedishValveRanks(allTeams, valveGlobalCache);

    allTeams.sort((a, b) => {
      const ra = sweValveRankMap[a.id], rb = sweValveRankMap[b.id];
      if (ra && rb) return ra - rb;
      if (ra) return -1;
      if (rb) return 1;
      return (b.matches.length - a.matches.length);
    });

    renderTeams();
  } catch(err) {
    console.error('[SWE CS2] Teams fetch error:', err);
    document.getElementById('content').innerHTML = `
      <div class="flex flex-col items-center justify-center py-24 text-center gap-3 col-span-full">
        <span class="material-symbols-outlined text-5xl text-on-surface-variant/50">wifi_off</span>
        <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Connection Error</h3>
        <p class="font-body-md text-body-md text-on-surface-variant">Unable to load team data.</p>
      </div>`;
  }
});

function onTeamSearch(q) {
  teamQuery = q.toLowerCase();
  renderTeams();
}

function renderTeams() {
  const filtered = teamQuery ? allTeams.filter(t => (t.name || '').toLowerCase().includes(teamQuery)) : allTeams;

  if (!filtered.length) {
    document.getElementById('content').innerHTML = `
      <div class="flex flex-col items-center justify-center py-24 text-center gap-3 col-span-full">
        <span class="material-symbols-outlined text-5xl text-on-surface-variant/50">groups</span>
        <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">No Teams Found</h3>
        <p class="font-body-md text-body-md text-on-surface-variant">Try a different search.</p>
      </div>`;
    return;
  }

  document.getElementById('content').innerHTML = filtered.map(renderTeamCard).join('');
}

function renderTeamCard(team) {
  const info = sweInfo({ id: team.id }) || {};
  const squadLabel = info.isFull ? 'Full Squad' : info.count ? info.count + '/5 Swedish' : '';
  const teamFlag = info.isMajority ? '🇸🇪' : teamCountryLine(team.id).split(' ')[0];
  const recent = team.matches.slice(0, 3);
  const sweRank   = sweValveRankMap[team.id] || null;
  const worldRank = findValveRank(valveGlobalCache, team.name)?.rank ?? null;
  const teamRegion = teamValveRegion(team.id);
  const regionCache = { europe: valveEuropeCache, americas: valveAmericasCache, asia: valveAsiaCache }[teamRegion];
  const regionRank  = findValveRank(regionCache, team.name)?.rank ?? null;
  const regionLabel = VALVE_REGION_LABELS[teamRegion].toUpperCase();

  const medal = sweRank === 1 ? 'gold' : sweRank === 2 ? 'silver' : sweRank === 3 ? 'bronze' : null;
  const cardMedalCls  = medal ? `rank-${medal} rank-shine` : '';
  const badgeMedalCls = medal ? `rank-badge-${medal}` : 'bg-swedish-gold text-deep-navy';

  // "Recent Matches" shows the last 3 matches played regardless of date,
  // while "Past 3 Months" below only counts matches within that exact
  // window — a team that's been quiet lately can show older wins/losses
  // here that don't count toward that total. The date on each row is what
  // makes that difference visible instead of looking like a mismatch.
  const recentHtml = recent.length
    ? recent.map(m => `
      <div class="flex justify-between items-center gap-2 text-sm">
        <div class="flex-1 min-w-0">
          <div class="text-on-surface truncate">vs ${m.oppName}</div>
          <div class="font-label-caps text-label-caps text-on-surface-variant/60">${new Date(m.date).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' })}</div>
        </div>
        <span class="font-bold shrink-0 ${m.won ? 'text-green-400' : 'text-red-400'}">${m.selfMaps} - ${m.oppMaps}</span>
        <span class="font-label-caps text-label-caps px-2 py-0.5 rounded border shrink-0 ${m.won ? 'bg-green-500/15 text-green-400 border-green-500/40' : 'bg-red-500/15 text-red-400 border-red-500/40'}">${m.won ? 'WIN' : 'LOSS'}</span>
      </div>`).join('')
    : `<div class="text-sm text-on-surface-variant">No recorded matches yet.</div>`;

  const sweSquadHtml = info.players?.length
    ? `<div class="flex flex-wrap gap-1 flex-1 min-w-0">${info.players.map(n => `<span class="font-metadata text-metadata text-on-surface-variant bg-surface-container-highest/40 px-1.5 py-0.5 rounded">${n}</span>`).join('')}</div>`
    : '';

  return `
  <article class="bg-deep-navy border border-outline-variant/20 rounded-xl p-4 flex flex-col gap-4 glow-card transition-all duration-300 relative overflow-hidden group ${cardMedalCls}">
    <div class="absolute inset-0 bg-gradient-to-br from-swedish-gold/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>

    <!-- Logo hero: no backdrop box, no outline glow — the logo just sits
         on the card at whatever size looks right. Sized with
         h-20/max-h-full/max-w-full, the only height/size utilities
         actually present in tailwind-built.css (it's a purged build —
         classes not already used elsewhere in the original markup, like
         h-28 or max-h-24, silently do nothing). -->
    <div class="relative z-10 h-20 flex items-center justify-center">
      ${sweRank ? `<div class="absolute top-2 left-2 w-9 h-9 rounded-lg ${badgeMedalCls} font-black flex items-center justify-center text-sm">#${sweRank}</div>` : ''}
      ${teamLogo({ image_url: team.logo, name: team.name }, 'max-h-full max-w-full object-contain')}
    </div>

    <div class="flex flex-col gap-1 z-10">
      <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold flex items-center gap-2 ${teamNameSizeClass(team.name, 'heading')}">
        ${teamFlag ? `<span class="shrink-0">${teamFlag}</span>` : ''}<span class="break-words">${team.name}</span>
      </h2>
      ${squadLabel ? `<div class="flex items-end gap-2 flex-wrap">
        <div class="shrink-0"><span class="font-label-caps text-label-caps text-swedish-gold block">Squad</span><span class="font-bold text-sm text-on-surface">${squadLabel}</span></div>
        ${sweSquadHtml}
      </div>` : ''}
      <div class="flex gap-2 flex-wrap">
        ${regionRank ? `<span class="font-label-caps text-label-caps text-on-surface-variant bg-surface-container-highest/40 px-1.5 py-0.5 rounded">${regionLabel} #${regionRank}</span>` : ''}
        ${worldRank ? `<span class="font-label-caps text-label-caps text-on-surface-variant bg-surface-container-highest/40 px-1.5 py-0.5 rounded">WORLD #${worldRank}</span>` : ''}
      </div>
    </div>
    <div class="bg-gradient-to-b from-surface-container-highest/50 via-surface-container-highest/25 to-transparent rounded-lg p-3 z-10 mt-2 border border-outline-variant/10">
      <span class="font-label-caps text-label-caps text-on-surface-variant block mb-2">Recent Matches</span>
      <div class="flex flex-col gap-2">${recentHtml}</div>
      <div class="mt-3 pt-3 border-t border-outline-variant/10 flex justify-between items-center">
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Past 3 Months</span>
        <span class="font-bold text-sm text-on-surface">${team.wins3m}W - ${team.losses3m}L</span>
      </div>
    </div>
  </article>`;
}
</script>
